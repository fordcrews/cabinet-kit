<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c2f24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Phone-browser card cabinet. Short sessions, no accounts, no store."
    />
    <title>Cabinet Kit</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/11up.css" />
    <link rel="stylesheet" href="css/arcade.css" />
    <link rel="stylesheet" href="css/patience.css" />
    <link rel="stylesheet" href="css/match.css" />
    <link rel="stylesheet" href="css/slot.css" />
    <link rel="stylesheet" href="css/chrome.css" />
    <link rel="stylesheet" href="css/feel.css" />
    <link rel="stylesheet" href="css/pieces.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
  </head>
  <body>
    <div class="cabinet">
      <div class="bezel">
        <header class="marquee">
          <div>
            <p class="brand" id="marquee-brand">Cabinet</p>
            <p class="brand-sub" id="marquee-sub">Card kit · offline</p>
          </div>
          <button type="button" class="sfx-toggle" id="btn-sfx" aria-pressed="false">SOUND</button>
          <div class="score-block" id="score-block" hidden>
            <span class="score-label" id="score-label">SCORE</span>
            <span class="score-value" id="score-value">0</span>
            <span class="score-best" id="score-best"></span>
          </div>
        </header>

        <main class="screen">
          <section id="view-cabinet" class="view active">
            <p class="lede">
              Pick a game. Big buttons, one sitting, no sign-in.
            </p>
            <ul class="game-list" id="game-list"></ul>
            <p class="foot">Add another title by dropping JSON in <code>games/</code>.</p>
          </section>

          <section id="view-game" class="view">
            <div class="hud">
              <span id="hud-round">ROUND 0</span>
              <span id="hud-deck">DECK 52</span>
            </div>

            <div id="play-run21" class="table">
              <div class="hand" id="hand" aria-live="polite"></div>
              <div>
                <span class="total-label" id="total-label">HAND</span>
                <div class="total" id="total">—</div>
              </div>
            </div>

            <div id="play-columns" class="columns-table hidden">
              <div class="incoming-wrap">
                <span class="incoming-label" id="incoming-label">NEXT</span>
                <div class="incoming" id="incoming" aria-live="polite"></div>
              </div>
              <div class="columns" id="columns"></div>
            </div>

            <div id="play-eleven" class="eleven-table hidden">
              <div class="eleven-grid eleven-pyramids" id="eleven-grid"></div>
              <div class="eleven-stocks" id="eleven-stocks" aria-label="Deck"></div>
            </div>

            <div id="play-power" class="power-table hidden">
              <div class="patience-top" id="patience-top">
                <div class="power-cells hidden" id="power-cells"></div>
                <div class="power-foundations" id="power-foundations"></div>
                <div class="power-stocks" id="power-stocks"></div>
                <div class="power-completed hidden" id="power-completed"></div>
              </div>
              <div class="power-tableau" id="power-tableau"></div>
            </div>

            <div id="play-yacht" class="yacht-table hidden">
              <div class="yacht-play">
                <div class="yacht-dice" id="yacht-dice"></div>
                <button type="button" class="btn" id="btn-roll">ROLL</button>
              </div>
              <div class="yacht-card" id="yacht-card"></div>
            </div>

            <div id="play-sudoku" class="sudoku-table hidden">
              <div class="sudoku-board">
                <div class="sudoku-grid" id="sudoku-grid"></div>
              </div>
              <div class="sudoku-pad" id="sudoku-pad"></div>
            </div>

            <div id="play-reversi" class="reversi-table hidden">
              <div class="reversi-board" id="reversi-board"></div>
            </div>

            <div id="play-hoops" class="hoops-table hidden">
              <div class="hoops-court" id="hoops-court">
                <div class="hoops-rim" id="hoops-rim"></div>
                <div class="hoops-ball" id="hoops-ball"></div>
              </div>
            </div>

            <div id="play-quiz" class="quiz-table hidden">
              <p class="quiz-q" id="quiz-q"></p>
              <div class="quiz-choices" id="quiz-choices"></div>
            </div>

            <div id="play-match" class="match-table hidden">
              <div class="match-grid" id="match-grid"></div>
            </div>

            <div id="play-slot" class="slot-table hidden">
              <canvas class="slot-canvas" id="slot-canvas"></canvas>
            </div>

            <div class="banner" id="banner"></div>

            <div class="controls">
              <button type="button" class="btn" id="btn-hit">HIT</button>
              <button type="button" class="btn stay" id="btn-stay">STAY</button>
              <button type="button" class="btn deal hidden" id="btn-deal">DEAL</button>
              <button type="button" class="btn skip-act hidden" id="btn-skip">SKIP</button>
              <button type="button" class="btn skip-act hidden" id="btn-next">NEXT CARD</button>
              <button type="button" class="btn stay hidden" id="btn-take">TAKE SCORE</button>
              <button type="button" class="btn hidden" id="btn-shoot">SHOOT</button>
              <button type="button" class="btn ghost back" id="btn-back">CABINET</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="js/engine.js"></script>
    <script src="js/solitaire.js"></script>
    <script src="js/play-ui.js"></script>
    <script src="js/11up.js"></script>
    <script src="js/yacht.js"></script>
    <script src="js/arcade.js"></script>
    <script src="js/app-quiznight.js"></script>
    <script src="js/match.js"></script>
    <script src="js/feel-engine.js"></script>
    <script src="js/feel-ui.js"></script>
    <script src="js/highscore.js"></script>
    <script src="js/sfx.js"></script>
    <script src="js/slot.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
