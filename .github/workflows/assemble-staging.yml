name: assemble-staging
on:
  push:
    paths:
      - "_staging/**"
      - ".github/workflows/assemble-staging.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed staging archives and assemble
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, base64, hashlib, io, tarfile
          from pathlib import Path
          staging = Path("_staging")
          staging.mkdir(exist_ok=True)
          changed = False

          def load_blob(prefix):
              chunks = []
              for i in range(8):
                  p = staging / f"{prefix}.{i}"
                  if p.exists():
                      chunks.append(p.read_text().strip())
                  else:
                      break
              if chunks:
                  return "".join(chunks)
              a = staging / f"{prefix}.a"
              b = staging / f"{prefix}.b"
              if a.exists() and b.exists():
                  return a.read_text().strip() + b.read_text().strip()
              one = staging / prefix
              if one.exists():
                  return one.read_text().strip()
              return None

          def extract_seed(prefix):
              blob = load_blob(prefix)
              if not blob:
                  return False
              raw = base64.b64decode(blob)
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tar:
                  names = tar.getnames()
                  print("extracted", prefix, names)
                  if any(n.startswith("js/") or n.startswith("tests/") or n.endswith(".md") for n in names):
                      tar.extractall(Path("."))
                      return True
                  tar.extractall(staging)
                  return False

          extract_seed("play-ui-seed.tgz.b64")
          if extract_seed("rest-seed.tgz.b64"):
              changed = True

          for man_path in sorted(staging.glob("*.b64.json")):
              man = json.loads(man_path.read_text())
              target = Path(man["target"])
              parts = []
              missing = False
              for p in man["parts"]:
                  fp = Path(p)
                  if not fp.exists():
                      print("skip", man_path.name, "missing", p)
                      missing = True
                      break
                  parts.append(fp.read_text().strip())
              if missing:
                  continue
              data = base64.b64decode("".join(parts))
              expect = man.get("md5")
              got = hashlib.md5(data).hexdigest()
              print(target, "md5", got, "expect", expect)
              if expect and got != expect:
                  raise SystemExit(f"md5 mismatch for {target}")
              if target.exists() and target.read_bytes() == data:
                  print("unchanged", target); continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print("wrote", target, len(data))
              changed = True

          Path("/tmp/changed").write_text("1" if changed else "0")
          PY
          if [ "$(cat /tmp/changed)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A js/ tests/ GAMES.md GAMES-2.md _staging/ || true
            if git diff --cached --quiet; then echo "nothing staged"; exit 0; fi
            git commit -m "Add Klondike draw/recycle options, undo, and solitaire auto-play"
            git push
          else
            echo "nothing to assemble"
          fi
